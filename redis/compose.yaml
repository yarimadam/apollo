services:
  redis:
    image: redis:8.10.1
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 3600 1 --requirepass ${REDIS_PASSWORD:?}
    security_opt:
      - no-new-privileges:true
    # The entrypoint chowns /data and drops to the redis user via setpriv.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - SETPCAP
    read_only: true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - data:/data
    networks:
      - apollo

volumes:
  data:

networks:
  apollo:
    external: true
