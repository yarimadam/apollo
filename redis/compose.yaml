services:
  redis:
    image: redis:8.10.1
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 3600 1 --requirepass ${REDIS_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - apollo

volumes:
  redis_data:
    name: redis_data

networks:
  apollo:
    external: true
