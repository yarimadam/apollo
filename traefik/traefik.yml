global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

# No forwardedHeaders.trustedIPs: Traefik is the edge, so client-supplied
# X-Forwarded-* headers are always overwritten, never trusted.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http3: {}
  admin:
    address: ":8443"

api:
  dashboard: true

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web
