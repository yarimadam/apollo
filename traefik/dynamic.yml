{{ $certResolver := env "CERT_RESOLVER" }}
http:
  routers:
    aiostreams:
      rule: 'Host(`{{ env "AIOSTREAMS_DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [security]
      service: aiostreams
      tls:
        certResolver: '{{ $certResolver }}'

    aiometadata:
      rule: 'Host(`{{ env "AIOMETADATA_DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [security]
      service: aiometadata
      tls:
        certResolver: '{{ $certResolver }}'

    slicksync:
      rule: 'Host(`{{ env "SLICKSYNC_DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [security]
      service: slicksync
      tls:
        certResolver: '{{ $certResolver }}'

    authelia:
      rule: 'Host(`{{ env "AUTH_DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [security, noframe]
      service: authelia
      tls:
        certResolver: '{{ $certResolver }}'

    # Only on the admin entrypoint, which is published on the Tailscale IP.
    dashboard:
      rule: 'PathPrefix(`/api`) || PathPrefix(`/dashboard`)'
      entryPoints: [admin]
      service: api@internal
      tls: {}

  middlewares:
    security:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          Server: ""
          X-Robots-Tag: "noindex, nofollow, noarchive"

    noframe:
      headers:
        frameDeny: true

  services:
    aiostreams:
      loadBalancer:
        servers:
          - url: http://aiostreams:3000
    aiometadata:
      loadBalancer:
        servers:
          - url: http://aiometadata:3232
    slicksync:
      loadBalancer:
        servers:
          - url: http://slicksync:3000
    authelia:
      loadBalancer:
        servers:
          - url: http://authelia:9091

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - X25519
        - CurveP256
