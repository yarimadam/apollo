services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    pids_limit: 256
    # Read by the templates in dynamic.yml.
    environment:
      CERT_RESOLVER: "${CERT_RESOLVER}"
      AIOSTREAMS_DOMAIN: "${AIOSTREAMS_DOMAIN:?}"
      AIOMETADATA_DOMAIN: "${AIOMETADATA_DOMAIN:?}"
      SLICKSYNC_DOMAIN: "${SLICKSYNC_DOMAIN:?}"
      AUTH_DOMAIN: "${AUTH_DOMAIN:?}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HTTPS_PORT:?}:443"
      - "${HTTPS_PORT:?}:443/udp"
      - "${HTTP_PORT:?}:80"
      # Tailscale-only. Traefik dashboard (self-signed cert).
      - "${INTERFACE:?}:8443:8443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - data:/data
    networks:
      apollo: {}
      # IPv6-enabled; carries the published ports and Traefik's default route.
      # The apps stay IPv4-only on apollo, so their outbound traffic is unchanged.
      apollo_edge:
        gw_priority: 1

volumes:
  data:

networks:
  apollo:
    external: true
  apollo_edge:
    external: true
