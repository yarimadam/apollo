services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.34.1
    container_name: aiostreams
    restart: unless-stopped
    environment:
      BASE_URL: "${AIOSTREAMS_BASE_URL}"
      SECRET_KEY: "${AIOSTREAMS_SECRET_KEY}"
      DATABASE_URI: "sqlite://./data/db.sqlite"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      AIOSTREAMS_AUTH: "${AIOSTREAMS_AUTH}"
      AIOSTREAMS_AUTH_REQUIRED: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - aiostreams_data:/app/data
    networks:
      - apollo

volumes:
  aiostreams_data:
    name: aiostreams_data

networks:
  apollo:
    external: true
