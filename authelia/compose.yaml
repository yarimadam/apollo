services:
  authelia:
    image: authelia/authelia:4.39.28
    container_name: authelia
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The entrypoint chowns /config and drops to PUID:PGID via su-exec.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    # No read_only: Authelia rewrites /app/.healthcheck.env on every start and
    # refuses to start if it can't.
    pids_limit: 256
    environment:
      PUID: "65532"
      PGID: "65532"
      X_AUTHELIA_CONFIG: /etc/authelia/configuration.yml
      AUTHELIA_SESSION_SECRET: "${AUTHELIA_SESSION_SECRET:?}"
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "${AUTHELIA_STORAGE_ENCRYPTION_KEY:?}"
      AUTHELIA_SESSION_REDIS_PASSWORD: "${AUTHELIA_SESSION_REDIS_PASSWORD:?}"
      # Read by the templates in configuration.yml.
      X_AUTHELIA_CONFIG_FILTERS: template
      DOMAIN: "${DOMAIN:?}"
      AUTH_DOMAIN: "${AUTH_DOMAIN:?}"
      AIOSTREAMS_DOMAIN: "${AIOSTREAMS_DOMAIN:?}"
      AIOMETADATA_DOMAIN: "${AIOMETADATA_DOMAIN:?}"
      SLICKSYNC_DOMAIN: "${SLICKSYNC_DOMAIN:?}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # SQLite database (2FA registrations, encrypted with the storage key) and
    # notification.txt (one-time codes, in place of email).
    volumes:
      - ./configuration.yml:/etc/authelia/configuration.yml:ro
      - ./users.yml:/etc/authelia/users.yml:ro
      - data:/config
    networks:
      - apollo

volumes:
  data:

networks:
  apollo:
    external: true
