services:
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    environment:
      PORTAINER_DOMAIN: "${PORTAINER_DOMAIN}"
      AIOSTREAMS_DOMAIN: "${AIOSTREAMS_DOMAIN}"
      AIOMETADATA_DOMAIN: "${AIOMETADATA_DOMAIN}"
      CADDY_INTERNAL_TLS: "${CADDY_INTERNAL_TLS}"
      CADDY_EXTERNAL_TLS: "${CADDY_EXTERNAL_TLS}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Container port 9000 (not 443) isolates Portainer from the external
      # listener's SNI routing.
      - "${INTERNAL_IP}:${INTERNAL_HTTPS_PORT}:9000"
      - "${INTERNAL_IP}:${INTERNAL_HTTPS_PORT}:9000/udp"
      - "${EXTERNAL_IP}:${EXTERNAL_HTTPS_PORT}:443"
      - "${EXTERNAL_IP}:${EXTERNAL_HTTPS_PORT}:443/udp"
      - "${EXTERNAL_IP}:${EXTERNAL_HTTP_PORT}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./robots.txt:/etc/caddy/static/robots.txt:ro
      # For Caddy's Tailscale cert manager (production only, unused locally).
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - apollo

volumes:
  caddy_data:
  caddy_config:

networks:
  apollo:
    external: true
