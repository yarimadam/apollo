services:
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORTAINER_DOMAIN: "${PORTAINER_DOMAIN:?PORTAINER_DOMAIN is required}"
      AIOSTREAMS_DOMAIN: "${AIOSTREAMS_DOMAIN:?AIOSTREAMS_DOMAIN is required}"
      AIOMETADATA_DOMAIN: "${AIOMETADATA_DOMAIN:?AIOMETADATA_DOMAIN is required}"
      CADDY_INTERNAL_TLS: "${CADDY_INTERNAL_TLS}"
      CADDY_EXTERNAL_TLS: "${CADDY_EXTERNAL_TLS}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Container port 9000 (not 443) isolates Portainer from the external
      # listener's SNI routing.
      - "${INTERNAL_IP:?INTERNAL_IP is required}:${INTERNAL_HTTPS_PORT:?INTERNAL_HTTPS_PORT is required}:9000"
      - "${INTERNAL_IP:?INTERNAL_IP is required}:${INTERNAL_HTTPS_PORT:?INTERNAL_HTTPS_PORT is required}:9000/udp"
      - "${EXTERNAL_IP:?EXTERNAL_IP is required}:${EXTERNAL_HTTPS_PORT:?EXTERNAL_HTTPS_PORT is required}:443"
      - "${EXTERNAL_IP:?EXTERNAL_IP is required}:${EXTERNAL_HTTPS_PORT:?EXTERNAL_HTTPS_PORT is required}:443/udp"
      - "${EXTERNAL_IP:?EXTERNAL_IP is required}:${EXTERNAL_HTTP_PORT:?EXTERNAL_HTTP_PORT is required}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./robots.txt:/etc/caddy/static/robots.txt:ro
      # For Caddy's Tailscale cert manager (production only, unused locally).
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - data:/data
    networks:
      - apollo

volumes:
  data:

networks:
  apollo:
    external: true
