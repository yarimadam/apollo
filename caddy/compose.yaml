services:
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    environment:
      INTERNAL_IP: "${INTERNAL_IP}"
      AIOSTREAMS_DOMAIN: "${AIOSTREAMS_DOMAIN}"
      AIOMETADATA_DOMAIN: "${AIOMETADATA_DOMAIN}"
      CADDY_EXTERNAL_TLS: "${CADDY_EXTERNAL_TLS}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Portainer's internal listener runs on a container-side port (8443)
      # distinct from the external listener's (443). This is deliberate: Caddy
      # multiplexes sites by SNI on whichever container port they're bound to,
      # so if both host mappings forwarded to the same container port, a
      # public client could reach the "internal-only" Portainer site just by
      # sending its SNI/Host over the external socket. Separate container
      # ports make that unreachable regardless of SNI.
      - "${INTERNAL_IP}:${INTERNAL_HTTPS_PORT:-8443}:8443"
      - "${INTERNAL_IP}:${INTERNAL_HTTPS_PORT:-8443}:8443/udp"
      - "${EXTERNAL_IP}:${EXTERNAL_HTTPS_PORT:-8444}:443"
      - "${EXTERNAL_IP}:${EXTERNAL_HTTPS_PORT:-8444}:443/udp"
      - "${EXTERNAL_IP}:${EXTERNAL_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./robots.txt:/etc/caddy/static/robots.txt:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - apollo

volumes:
  caddy_data:
  caddy_config:

networks:
  apollo:
    external: true
