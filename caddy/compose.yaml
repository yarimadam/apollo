services:
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    environment:
      PORTAINER_DOMAIN: "${PORTAINER_DOMAIN}"
      AIOSTREAMS_DOMAIN: "${AIOSTREAMS_DOMAIN}"
      AIOMETADATA_DOMAIN: "${AIOMETADATA_DOMAIN}"
      CADDY_INTERNAL_TLS: "${CADDY_INTERNAL_TLS}"
      CADDY_EXTERNAL_TLS: "${CADDY_EXTERNAL_TLS}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Portainer's internal listener runs on a container-side port (9000,
      # matching Portainer's own upstream port for easy spotting) distinct
      # from the external listener's (443). This is deliberate: Caddy
      # multiplexes sites by SNI on whichever container port they're bound to,
      # so if both host mappings forwarded to the same container port, a
      # public client could reach the "internal-only" Portainer site just by
      # sending its SNI/Host over the external socket. Separate container
      # ports make that unreachable regardless of SNI.
      - "${INTERNAL_IP}:${INTERNAL_HTTPS_PORT}:9000"
      - "${INTERNAL_IP}:${INTERNAL_HTTPS_PORT}:9000/udp"
      - "${EXTERNAL_IP}:${EXTERNAL_HTTPS_PORT}:443"
      - "${EXTERNAL_IP}:${EXTERNAL_HTTPS_PORT}:443/udp"
      - "${EXTERNAL_IP}:${EXTERNAL_HTTP_PORT}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./robots.txt:/etc/caddy/static/robots.txt:ro
      # Lets Caddy's built-in Tailscale cert manager reach tailscaled to fetch/
      # renew the *.ts.net cert itself (production only — see PORTAINER_DOMAIN
      # in .env.example). Harmless locally: CADDY_INTERNAL_TLS is "tls internal"
      # there instead, so this socket is never dialed even if the mount is just
      # an empty path.
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - apollo

volumes:
  caddy_data:
  caddy_config:

networks:
  apollo:
    external: true
