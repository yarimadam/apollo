services:
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      AIOSTREAMS_DOMAIN: "${AIOSTREAMS_DOMAIN:?}"
      AIOMETADATA_DOMAIN: "${AIOMETADATA_DOMAIN:?}"
      CADDY_TLS: "${CADDY_TLS}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${CADDY_HTTPS_PORT:?}:443"
      - "${CADDY_HTTPS_PORT:?}:443/udp"
      - "${CADDY_HTTP_PORT:?}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./robots.txt:/etc/caddy/static/robots.txt:ro
      - data:/data
    networks:
      - apollo

volumes:
  data:

networks:
  apollo:
    external: true
