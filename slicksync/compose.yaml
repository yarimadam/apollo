services:
  slicksync:
    # Upstream only publishes a floating `private` tag, so pin its digest.
    image: ghcr.io/slicknsliding/slicksync:private@sha256:fc69f2927ea19533f237aa2e6e6336ecd0016fda92c76e7dc8b78c178c35fc71
    container_name: slicksync
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    environment:
      JWT_SECRET: "${JWT_SECRET:?}"
      # Without these the private instance has no login at all.
      SLICKSYNC_PRIVATE_USERNAME: "${SLICKSYNC_PRIVATE_USERNAME:?}"
      SLICKSYNC_PRIVATE_PASSWORD: "${SLICKSYNC_PRIVATE_PASSWORD:?}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL}"
      # Now Playing via AIOStreams' live-streams dashboard. That endpoint is
      # admin-only, so this is a dedicated AIOStreams admin login, listed in
      # aiostreams/.env AIOSTREAMS_AUTH.
      AIOSTREAMS_URL: "http://aiostreams:3000"
      AIOSTREAMS_AUTH_USERNAME: "${AIOSTREAMS_AUTH_USERNAME:?}"
      AIOSTREAMS_AUTH_PASSWORD: "${AIOSTREAMS_AUTH_PASSWORD:?}"
      AIOSTREAMS_IGNORE_IPS: "${AIOSTREAMS_IGNORE_IPS}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # SQLite database and the self-generated ENCRYPTION_KEY that stored
    # provider credentials are encrypted against.
    volumes:
      - data:/app/data
    networks:
      - apollo

volumes:
  data:

networks:
  apollo:
    external: true
